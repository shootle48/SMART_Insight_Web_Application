# Config broker สำหรับ Meter
#
# mosquitto 2.0 เปลี่ยน default สองอย่างที่ทำให้ `docker run` เปล่า ๆ ดูเหมือนพัง:
#   1. ไม่เขียน `listener` → bind loopback *ในคอนเทนเนอร์* port mapping จึงไปไม่ถึง
#   2. `allow_anonymous` default = false → client โดน "not authorised" ทุกตัว
# ทั้งสองข้อเขียนไว้ชัดข้างล่างแล้ว อย่าลบ

listener 1883 0.0.0.0

# DEV เท่านั้น — edge 3 ตัวบน LAN โรงงานก็ยังควรมี user/password + topic ACL รายเครื่อง
# แต่ทำตอน T-008 หลัง core เดินครบ ไม่ใช่ก่อน
allow_anonymous true

# เก็บข้อความ QoS 1 ให้ subscriber ที่ยังไม่ออนไลน์
# จุดประสงค์ของ QoS 1 + persistent session คือ restart แล้วต้องไม่หายเฟรม
# ถ้าไม่เปิดข้อนี้ คิวอยู่ในหน่วยความจำและตายไปพร้อมคอนเทนเนอร์
persistence true
persistence_location /mosquitto/data/

# retained ต้องรอด broker restart ด้วย ไม่งั้น kiosk ที่บูตพร้อม broker จะได้จอเปล่า
autosave_interval 30

log_dest stdout
log_type warning
log_type error
log_type notice
